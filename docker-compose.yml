services:
  db:
    image: postgres:16.6
    environment:
      POSTGRES_DB: ratelimiter
      POSTGRES_USER: rateuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rateuser -d ratelimiter"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cache:
    image: redis:7.4.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
    command:
      - python
      - -c
      - |
        import glob
        import os
        import psycopg

        with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True) as conn:
            for path in sorted(glob.glob("/app/migrations/*.sql")):
                with open(path, encoding="utf-8") as f:
                    conn.execute(f.read())
                print("Applied migration:", os.path.basename(path))
    environment:
      DATABASE_URL: postgresql://rateuser:${POSTGRES_PASSWORD:-localdevpassword}@db:5432/ratelimiter
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://rateuser:${POSTGRES_PASSWORD:-localdevpassword}@db:5432/ratelimiter
      REDIS_URL: redis://cache:6379/0
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
