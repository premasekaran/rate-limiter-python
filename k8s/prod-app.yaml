
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rate-limiter
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rate-limiter
  template:
    metadata:
      labels:
        app: rate-limiter
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: rate-limiter
          image: premasekaran/rate-limiter-python:prod
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: DATABASE_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@db:5432/ratelimiter
            - name: REDIS_URL
              value: redis://cache:6379/0
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rate-limiter
  namespace: prod
spec:
  selector:
    app: rate-limiter
  ports:
    - port: 8080
      targetPort: 8080
  type: NodePort
